name: PACS-AI unit tests

# Rev 11 milestone 1 (B00). The upstream OHIF workflows in this folder filter
# on main/master, which this fork never pushes to, so nothing ran here before.
# The deploy repo (PACS-AIG/ohif) runs the same command as its gate; this one
# gives the signal on the branch where the code changes.
on:
  push:
    branches: [ 'pacs-aig/**' ]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the node:18 the deploy Dockerfile builds on.
          node-version: 18

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      # The extension's suites, plus the in-frame sign-in (platform/app/src/utils:
      # preInitSignIn, embedAuth, oidcUserManager) and the attempt trace
      # (platform/core/src/utils/attempt), which the extension-only command
      # never ran. Only the attempt folder of core's utils: the rest holds the
      # upstream Queue.test.js, which is timing-flaky.
      # Rev 11 milestone 6 part 2: the route init scoped to its run
      # (platform/app/src/routes/Mode) and the study-metadata cache's eviction
      # (the default extension's retrieveStudyMetadata; only that file, the
      # extension's other upstream suites are not this gate's).
      - name: PACS-AI unit tests
        run: yarn jest extensions/pacsai-hp platform/app/src/utils platform/app/src/routes/Mode platform/core/src/utils/attempt extensions/default/src/DicomWebDataSource/retrieveStudyMetadata --ci
